<section class="gap-lg mx-auto flex max-w-3xl flex-col" data-testid="uea-registration">
  <header>
    <h1 class="text-h2 text-primary font-bold">
      {{ 'ACADEMIC_CATALOG.UEAS.CREATE.TITLE' | translate }}
    </h1>
    <p class="text-text-secondary">
      {{ 'ACADEMIC_CATALOG.UEAS.CREATE.SUBTITLE' | translate }}
    </p>
  </header>

  @if (error()) {
    <p-message severity="error" [text]="error() | domainError: catalogErrorScope" />
  }

  <form
    class="border-outline bg-surface p-lg sm:p-xl gap-lg flex flex-col rounded-xl border"
    [formGroup]="form"
    (ngSubmit)="submit()"
  >
    <div class="gap-md grid md:grid-cols-2">
      <label class="gap-xs flex flex-col md:col-span-2">
        <span>{{ 'ACADEMIC_CATALOG.UEAS.FIELDS.CLAVE' | translate }} *</span>
        <input pInputText formControlName="clave" [attr.maxlength]="20" />
        <app-field-error [control]="form.controls.clave" [submitted]="submitted()" />
      </label>

      <label class="gap-xs flex flex-col md:col-span-2">
        <span>{{ 'ACADEMIC_CATALOG.UEAS.FIELDS.NOMBRE' | translate }} *</span>
        <input pInputText formControlName="nombre" [attr.maxlength]="200" />
        <app-field-error [control]="form.controls.nombre" [submitted]="submitted()" />
      </label>

      <div class="gap-xs flex flex-col">
        <label for="uea-tipo">{{ 'ACADEMIC_CATALOG.UEAS.FIELDS.TIPO' | translate }} *</label>
        <app-i18n-select inputId="uea-tipo" controlName="tipo" [options]="tipoOptions" />
        <app-field-error [control]="form.controls.tipo" [submitted]="submitted()" />
      </div>

      <div class="gap-xs flex flex-col">
        <label for="uea-modalidad">{{
          'ACADEMIC_CATALOG.UEAS.FIELDS.MODALIDAD' | translate
        }}</label>
        <app-i18n-select
          inputId="uea-modalidad"
          controlName="modalidad"
          [options]="modalidadOptions"
        />
      </div>

      <label class="gap-xs flex flex-col">
        <span>{{ 'ACADEMIC_CATALOG.UEAS.FIELDS.H_TEOR' | translate }} *</span>
        <input pInputText type="number" step="0.5" min="0" formControlName="horasTeoria" />
        <app-field-error [control]="form.controls.horasTeoria" [submitted]="submitted()" />
      </label>

      <label class="gap-xs flex flex-col">
        <span>{{ 'ACADEMIC_CATALOG.UEAS.FIELDS.H_PRAC' | translate }} *</span>
        <input pInputText type="number" step="0.5" min="0" formControlName="horasPractica" />
        <app-field-error [control]="form.controls.horasPractica" [submitted]="submitted()" />
      </label>

      <div class="gap-xs flex flex-col">
        <label for="uea-tipo-formacion"
          >{{ 'ACADEMIC_CATALOG.UEAS.FIELDS.TIPO_FORMACION' | translate }} *</label
        >
        <app-i18n-select
          inputId="uea-tipo-formacion"
          controlName="tipoFormacion"
          [options]="formacionOptions"
        />
        <app-field-error [control]="form.controls.tipoFormacion" [submitted]="submitted()" />
      </div>

      <label class="gap-xs flex flex-col">
        <span>{{ 'ACADEMIC_CATALOG.UEAS.FIELDS.CREDITOS' | translate }} *</span>
        <input pInputText type="number" step="1" min="1" formControlName="creditos" />
        <app-field-error [control]="form.controls.creditos" [submitted]="submitted()" />
      </label>
    </div>

    <footer class="border-outline pt-md gap-sm flex justify-end border-t">
      <p-button
        type="button"
        severity="secondary"
        variant="outlined"
        [label]="'COMMON.ACTIONS.CANCEL' | translate"
        (onClick)="cancel()"
      />
      <p-button
        type="submit"
        data-testid="confirm-uea"
        [label]="'COMMON.ACTIONS.SAVE' | translate"
        [loading]="loading()"
        [disabled]="loading()"
      />
    </footer>
  </form>
</section>
