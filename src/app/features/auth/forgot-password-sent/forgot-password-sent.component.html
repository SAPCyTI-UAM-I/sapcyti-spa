<app-auth-page-layout>
  <div class="auth-card border-brand-outline bg-brand-surface w-full rounded-xl border p-6 shadow-sm sm:p-10">
    <div class="mb-5 flex justify-center sm:mb-6">
      <div
        class="bg-brand-primary-container flex h-14 w-14 items-center justify-center rounded-full"
      >
        <i class="pi pi-envelope text-brand-primary text-3xl"></i>
      </div>
    </div>

    <header class="mb-4 text-center">
      <h2 class="text-brand-primary mb-3 text-lg font-semibold sm:mb-4 sm:text-xl">
        {{ 'AUTH.FORGOT_PASSWORD_SENT.TITLE' | translate }}
      </h2>
      <p class="text-brand-text-secondary text-sm leading-relaxed">
        {{ 'AUTH.FORGOT_PASSWORD_SENT.MESSAGE' | translate }}
      </p>
    </header>

    <p class="text-brand-text-secondary mb-8 text-center text-xs italic">
      {{ 'AUTH.FORGOT_PASSWORD_SENT.SPAM_HINT' | translate }}
    </p>

    <p-button
      routerLink="/auth/login"
      [label]="'AUTH.FORGOT_PASSWORD_SENT.BACK_TO_LOGIN' | translate"
      styleClass="w-full"
    />
  </div>

  <app-auth-footer />
</app-auth-page-layout>
