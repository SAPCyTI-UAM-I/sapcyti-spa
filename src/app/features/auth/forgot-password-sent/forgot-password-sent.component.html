<app-auth-page-layout>
  <div
    class="auth-card border-outline bg-surface-container-lowest w-full rounded-xl border p-6 shadow-sm sm:p-[40px]"
  >
    <div class="mb-lg flex justify-center">
      @if (isMock) {
        <a
          routerLink="/auth/reset-password"
          [queryParams]="{ token: mockResetToken }"
          class="bg-secondary-container flex h-14 w-14 cursor-pointer items-center justify-center rounded-full transition-opacity hover:opacity-70"
          pTooltip="Demo: abrir enlace de correo"
          tooltipPosition="top"
        >
          <i class="pi pi-envelope text-success text-3xl"></i>
        </a>
      } @else {
        <div class="bg-secondary-container flex h-14 w-14 items-center justify-center rounded-full">
          <i class="pi pi-envelope text-success text-3xl"></i>
        </div>
      }
    </div>

    <header class="mb-md text-center">
      <h2 class="text-h2 text-primary font-h2">
        {{ 'AUTH.FORGOT_PASSWORD_SENT.TITLE' | translate }}
      </h2>
    </header>

    <div class="mb-md text-center">
      <p class="text-body-md text-text-secondary font-body-md">
        {{ 'AUTH.FORGOT_PASSWORD_SENT.MESSAGE' | translate }}
      </p>
    </div>

    <p class="text-caption text-text-secondary font-caption mb-xl text-center italic">
      {{ 'AUTH.FORGOT_PASSWORD_SENT.SPAM_HINT' | translate }}
    </p>

    <p-button
      routerLink="/auth/login"
      [label]="'AUTH.FORGOT_PASSWORD_SENT.BACK_TO_LOGIN' | translate"
      styleClass="w-full"
    />
  </div>

  <app-auth-footer />
</app-auth-page-layout>
