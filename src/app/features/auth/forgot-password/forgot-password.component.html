<app-auth-page-layout>
  <div class="auth-card border-brand-outline bg-brand-surface w-full rounded-xl border p-6 shadow-sm sm:p-10">
    <header class="mb-5 text-center sm:mb-6">
      <h1 class="text-brand-primary mb-3 text-lg font-bold tracking-tight sm:mb-4 sm:text-xl">
        {{ 'AUTH.LOGIN.BRAND' | translate }}
      </h1>
      <h2 class="text-brand-text mb-2 text-lg font-semibold sm:text-xl">
        {{ 'AUTH.FORGOT_PASSWORD.TITLE' | translate }}
      </h2>
      <p class="text-brand-text-secondary text-sm leading-relaxed">
        {{ 'AUTH.FORGOT_PASSWORD.DESCRIPTION' | translate }}
      </p>
    </header>

    @if (serverError()) {
      <p-message
        severity="error"
        icon="pi pi-times-circle"
        [text]="'COMMON.ERRORS.SERVER_ERROR' | translate"
        styleClass="mb-4 w-full"
      />
    }

    <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="flex flex-col gap-1">
        <label class="text-brand-text text-sm font-medium" for="email">
          {{ 'AUTH.FORGOT_PASSWORD.EMAIL' | translate }}
        </label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          autocomplete="username"
          class="w-full"
          [placeholder]="'AUTH.FORGOT_PASSWORD.EMAIL_PLACEHOLDER' | translate"
          [class.p-invalid]="showFieldError()"
        />
        <app-field-error [control]="form.controls.email" />
      </div>

      <p-button
        type="submit"
        [label]="'AUTH.FORGOT_PASSWORD.SUBMIT' | translate"
        styleClass="w-full"
        [loading]="submitting()"
        [disabled]="submitting()"
      />
    </form>

    <footer class="mt-8">
      <a
        class="text-brand-primary hover:text-brand-primary-hover inline-flex items-center gap-1 text-sm font-medium hover:underline"
        routerLink="/auth/login"
      >
        <i class="pi pi-arrow-left text-xs"></i>
        {{ 'AUTH.FORGOT_PASSWORD.BACK_TO_LOGIN' | translate }}
      </a>
    </footer>
  </div>

  <app-auth-footer />
</app-auth-page-layout>
