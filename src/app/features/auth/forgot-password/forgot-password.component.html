<app-auth-page-layout>
  <div
    class="auth-card border-outline bg-surface-container-lowest p-lg sm:p-xl flex w-full flex-col items-center rounded-xl border shadow-sm"
  >
    <header class="mb-xl w-full text-center">
      <h1 class="text-headline-md text-primary font-headline-md mb-md font-bold tracking-tight">
        {{ 'AUTH.LOGIN.BRAND' | translate }}
      </h1>
      <h2 class="text-h2 text-on-surface font-h2 mb-sm">
        {{ 'AUTH.FORGOT_PASSWORD.TITLE' | translate }}
      </h2>
      <p class="text-body-md text-text-secondary font-body-md leading-relaxed">
        {{ 'AUTH.FORGOT_PASSWORD.DESCRIPTION' | translate }}
      </p>
    </header>

    @if (serverError()) {
      <p-message
        severity="error"
        icon="pi pi-times-circle"
        [text]="'COMMON.ERRORS.SERVER_ERROR' | translate"
        styleClass="mb-md w-full"
      />
    }

    <form class="gap-lg flex w-full flex-col" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="gap-xs flex w-full flex-col">
        <label class="text-label-md text-on-surface font-label-md" for="email">
          {{ 'AUTH.FORGOT_PASSWORD.EMAIL' | translate }}
        </label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          autocomplete="username"
          class="w-full"
          [placeholder]="'AUTH.FORGOT_PASSWORD.EMAIL_PLACEHOLDER' | translate"
          [class.p-invalid]="isFieldInvalid(form.controls.email, submitted())"
        />
        <app-field-error [control]="form.controls.email" [submitted]="submitted()" />
      </div>

      <p-button
        type="submit"
        [label]="'AUTH.FORGOT_PASSWORD.SUBMIT' | translate"
        styleClass="w-full"
        [loading]="submitting()"
        [disabled]="submitting()"
      />
    </form>

    <footer class="mt-xl">
      <a
        class="text-body-md text-primary hover:text-primary-hover font-body-md gap-xs inline-flex items-center transition-colors hover:underline"
        routerLink="/auth/login"
      >
        <i class="pi pi-arrow-left text-caption"></i>
        {{ 'AUTH.FORGOT_PASSWORD.BACK_TO_LOGIN' | translate }}
      </a>
    </footer>
  </div>

  <app-auth-footer />
</app-auth-page-layout>
