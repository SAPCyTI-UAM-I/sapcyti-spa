<div class="bg-surface-muted text-on-surface font-body-md flex min-h-screen">
  <app-shell-sidebar-nav [navigation]="navigation()" (logout)="onLogout()" />

  <app-shell-mobile-drawer
    [visible]="mobileMenuOpen()"
    (visibleChange)="mobileMenuOpen.set($event)"
    [navigation]="navigation()"
    (logout)="onLogout()"
  />

  <div class="flex min-h-screen flex-1 flex-col md:ml-[280px]">
    <header
      class="border-outline bg-surface px-lg sticky top-0 z-40 flex h-16 items-center justify-between border-b"
    >
      <div class="gap-md flex items-center">
        <p-button
          class="md:hidden"
          icon="pi pi-bars"
          severity="secondary"
          variant="text"
          [rounded]="true"
          (onClick)="mobileMenuOpen.set(true)"
          [attr.aria-label]="'SHELL.TOPBAR.MENU' | translate"
        />
        <div
          class="text-label-md text-text-secondary font-label-md gap-xs hidden items-center sm:flex"
        >
          <i class="pi pi-home text-primary text-[20px]" aria-hidden="true"></i>
          <i class="pi pi-chevron-right text-[16px]" aria-hidden="true"></i>
          <span class="text-primary font-bold">{{ 'SHELL.MENU.HOME' | translate }}</span>
        </div>
      </div>

      <div class="mx-lg hidden max-w-md flex-1 md:block">
        <div class="relative w-full">
          <i
            class="pi pi-search text-text-tertiary left-sm absolute top-1/2 -translate-y-1/2"
            aria-hidden="true"
          ></i>
          <input
            pInputText
            type="text"
            class="bg-surface-muted pl-xl w-full"
            [placeholder]="'SHELL.TOPBAR.SEARCH_PLACEHOLDER' | translate"
          />
        </div>
      </div>

      <div class="gap-lg flex items-center">
        <app-language-switcher />

        <p-button
          icon="pi pi-bell"
          severity="secondary"
          variant="text"
          [rounded]="true"
          [badge]="'2'"
          badgeSeverity="warn"
          [attr.aria-label]="'SHELL.TOPBAR.NOTIFICATIONS' | translate"
        />

        <p-avatar
          [label]="userInitials()"
          shape="circle"
          [attr.aria-label]="currentUser()?.email"
        />
      </div>
    </header>

    <main class="p-margin md:p-xl flex-1">
      <router-outlet />
    </main>
  </div>
</div>
