<div class="bg-surface-100 flex min-h-screen">
  <app-shell-sidebar-nav [navigation]="navigation()" (logout)="onLogout()" />

  <app-shell-mobile-drawer
    [(visible)]="mobileMenuOpen"
    [navigation]="navigation()"
    (logout)="onLogout()"
  />

  <div class="flex min-h-screen flex-1 flex-col md:ml-[280px]">
    <header
      class="border-surface-200 bg-surface-0 sticky top-0 z-40 flex h-16 items-center justify-between border-b px-4 md:px-6"
    >
      <div class="flex items-center gap-3">
        <p-button
          class="md:hidden"
          icon="pi pi-bars"
          severity="secondary"
          variant="text"
          [rounded]="true"
          (onClick)="mobileMenuOpen.set(true)"
          [attr.aria-label]="'SHELL.TOPBAR.MENU' | translate"
        />
        <div class="text-surface-500 hidden items-center gap-1 text-sm sm:flex">
          <i class="pi pi-home text-primary" aria-hidden="true"></i>
          <i class="pi pi-chevron-right text-xs" aria-hidden="true"></i>
          <span class="text-primary font-semibold">{{ 'SHELL.MENU.HOME' | translate }}</span>
        </div>
      </div>

      <div class="mx-4 hidden max-w-md flex-1 md:block">
        <p-iconfield>
          <p-inputicon styleClass="pi pi-search" />
          <input
            pInputText
            type="text"
            class="w-full"
            [placeholder]="'SHELL.TOPBAR.SEARCH_PLACEHOLDER' | translate"
          />
        </p-iconfield>
      </div>

      <div class="flex items-center gap-3">
        <app-language-switcher />

        <p-button
          icon="pi pi-bell"
          severity="secondary"
          variant="text"
          [rounded]="true"
          [badge]="'2'"
          badgeSeverity="warn"
          [attr.aria-label]="'SHELL.TOPBAR.NOTIFICATIONS' | translate"
        />

        <p-avatar
          [label]="userInitials()"
          shape="circle"
          [attr.aria-label]="currentUser()?.email"
        />
      </div>
    </header>

    <main class="flex-1 p-4 md:p-6">
      <router-outlet />
    </main>
  </div>
</div>
